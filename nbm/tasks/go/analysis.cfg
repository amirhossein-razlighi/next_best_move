# KataGo analysis-engine config of the Go labels (nbm/tasks/go/katago.py). Visits, thread and batch settings are passed with
# -override-config. Winrates / score leads are reported for the side to move.
logToStderr = false
logAllRequests = false
logAllResponses = false
logSearchInfo = false
reportAnalysisWinratesAs = SIDETOMOVE
maxVisits = 400
numAnalysisThreads = 32
numSearchThreadsPerAnalysisThread = 2
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
numNNServerThreadsPerModel = 2
