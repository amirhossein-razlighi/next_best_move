# Connect Four, image model (paper Table 2): Qwen-Image-2.1 LoRA, 256 px, the paper run's hyper-parameters.
task: connect4
family: image

data:
  dir: connect4                # under $NBM_DATA: train / val / test / test_hard .parquet (nbm/tasks/connect4/data.py)
  train_limit: 1000000         # more than the 200,000 train rows: all of them

model:
  base: Qwen-Image-2.1
  resolution: 256
  split_devices: true          # text encoder + VAE on one GPU, DiT on another (2 GPUs per process)
  lora:
    rank: 64
    alpha: 64.0
    dropout: 0.0
    targets: [to_q, to_k, to_v, to_out.0, img_mlp.proj, img_mlp.gate_layer, img_mlp.out]

train:
  output_dir: runs/connect4_image
  processes: 4                 # 4 processes x 2 GPUs (one 8-GPU node); global batch 16
  batch_size: 4
  grad_accum: 1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  warmup_steps: 200
  max_steps: 12000
  max_grad_norm: 1.0
  highlight_loss_weight: 1.0
  gradient_checkpointing: true
  seed: 0
  num_workers: 8
  log_every: 10
  save_every: 1000
  eval_every: 1000
  eval_n: 256                  # the first 256 val positions
  eval_steps: 20
  eval_batch_size: 8
  dist_timeout_min: 240
  resume: null

eval:
  steps: 20                    # Euler steps (--steps 1 = the one-step readout)
  batch_size: 8
  seed: 0
  votes: 1
