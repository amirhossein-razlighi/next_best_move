# Chess, image model (paper Tab. 1 "Image model"): Qwen-Image-2.1 LoRA, 256 px boards, the first 3M training puzzles,
# 375k steps at global batch 8 (8 processes x 2 GPUs).
task: chess
family: image

data:
  dir: chess                   # $NBM_DATA/chess/{train,val,test}.parquet (nbm/tasks/chess/data.py)
  train_limit: 3000000

model:
  base: Qwen-Image-2.1
  resolution: 256
  split_devices: true
  lora:
    rank: 64
    alpha: 64.0
    dropout: 0.0
    targets: [to_q, to_k, to_v, to_out.0, img_mlp.proj, img_mlp.gate_layer, img_mlp.out]

train:
  output_dir: runs/chess_image
  processes: 8
  batch_size: 1
  grad_accum: 1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  warmup_steps: 200
  max_steps: 375000
  max_grad_norm: 1.0
  highlight_loss_weight: 1.0
  gradient_checkpointing: true
  seed: 0
  num_workers: 8
  log_every: 10
  save_every: 9375
  eval_every: 18750
  eval_n: 256
  eval_steps: 20
  eval_batch_size: 8
  dist_timeout_min: 240
  resume: null

eval:
  steps: 20                    # Euler steps; --steps 1 = the one-step readout
  batch_size: 8                # boards of one side to move per batch
  seed: 0                      # vote sample j uses seed + j
  votes: 1
  chunk_rows: 2500             # rows per chunk (noise batch index restarts per chunk); 10000 = Tab. 1's 20-step single run
