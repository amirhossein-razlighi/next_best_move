# Billiards, video model (paper: Table 2 "Billiards", video column).
# Wan2.2-TI2V-5B + rank-64 LoRA; clip = layout, DECIDE (the shot mark), the simulated balls, the resting state (nbm/tasks/billiards).
task: billiards
family: video

data:
  dir: billiards               # under $NBM_DATA
  train_limit: 200000          # every training layout

model:
  base: Wan2.2-TI2V-5B-Diffusers   # under $NBM_MODELS
  resolution: 288              # the canvas height; billiards clips are 512 x 288
  flow_shift: 3.0
  lora:
    rank: 64
    alpha: 64.0
    dropout: 0.0
    targets: [to_q, to_k, to_v, to_out.0, ffn.net.0.proj, ffn.net.2]

train:
  output_dir: runs/billiards_video
  processes: 8                 # 8 processes x 1 GPU; global batch 1 x 2 x 8 = 16 clips
  batch_size: 1
  grad_accum: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  warmup_steps: 200
  max_steps: 12000
  max_grad_norm: 1.0
  gradient_checkpointing: true
  seed: 0
  num_workers: 4
  log_every: 10
  save_every: 250
  eval_every: 500
  eval_n: 128
  eval_steps: 30
  eval_batch_size: 2
  dist_timeout_min: 240
  resume: null

eval:
  steps: 30                    # UniPC steps; --steps 1 = the paper's one-step row
  batch_size: 2                # the paper's test batches
  seed: 0
  votes: 1
