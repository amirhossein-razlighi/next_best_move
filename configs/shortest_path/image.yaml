# Shortest path, image model (Table 2): closed loop, one move per call.
task: pathfinding.shortest_path
family: image

data:
  dir: shortest_path          # under $NBM_DATA (python -m nbm.tasks.pathfinding.data)
  train_limit: 1000000           # every training row (200,000 maps)

model:
  base: Qwen-Image-2.1
  resolution: 384                # 32 px cells = 2 x 2 Qwen tokens
  split_devices: true
  lora:
    rank: 64
    alpha: 64.0
    dropout: 0.0
    targets: [to_q, to_k, to_v, to_out.0, img_mlp.proj, img_mlp.gate_layer, img_mlp.out]

train:
  output_dir: runs/shortest_path_image
  processes: 2                   # 2 processes x 2 GPUs; global batch 4 x 1 x 2 = 8
  batch_size: 4
  grad_accum: 1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  warmup_steps: 200
  max_steps: 8000
  max_grad_norm: 1.0
  highlight_loss_weight: 1.0
  gradient_checkpointing: true
  seed: 0
  num_workers: 8
  log_every: 10
  save_every: 1000
  eval_every: 1000
  eval_n: 256
  eval_steps: 20
  eval_batch_size: 8
  dist_timeout_min: 240
  resume: null

eval:
  steps: 20                      # Euler steps per call of the closed loop (--steps 1 = the one-step readout)
  batch_size: 8                  # outputs depend on the batch at bfloat16 rounding level
  seed: 0
  votes: 1
